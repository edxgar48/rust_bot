<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#006B5E" />
    <link rel="icon" href="icone.svg" type="image/svg+xml" />
    <title>Força das Dezenas</title>
    <!-- Aplica o tema escolhido antes da primeira pintura (sem flash). A chave 'tema' é a
         mesma de CHAVE_TEMA em src/lib/tema.ts (um teste confere). Falha = segue o sistema. -->
    <script>
      try {
        var t = localStorage.getItem('tema');
        if (t === 'claro' || t === 'escuro') document.documentElement.setAttribute('data-tema', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
