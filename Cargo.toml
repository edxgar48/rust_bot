[package]
name = "rust_spider"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"

[dependencies]
playwright = "0.0.18"
clap = { version = "4.5.23", features = ["derive"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.42.0", features = ["full"] }
thiserror = "2.0.21"
anyhow = "1.0.104"
calamine = "0.36.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
toml = "1.1.6"
sha2 = "0.11.0"
parquet = { version = "60.0.0", default-features = false }

[dev-dependencies]
# Só para gerar as planilhas de `tests/fixtures/` (ver `tests/comum/mod.rs`).
# É o mesmo crate (e versão) que o calamine já usa: nenhum download novo.
zip = { version = "8.6", default-features = false }
# Só para ler de volta, nos testes, o Parquet montado em memória (o leitor do
# crate `parquet` aceita `bytes::Bytes`). Já vem no Cargo.lock via tokio.
bytes = "1"
