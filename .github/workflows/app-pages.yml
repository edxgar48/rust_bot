# Publica o app (app/) no GitHub Pages: https://edxgar48.github.io/rust_bot/
# Não usa Rust nem publico/ (ignorado pelo git): os testes do app rodam com as
# fixtures versionadas em app/testes/fixtures/.
name: App no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/app-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# Um deploy por vez; um deploy em andamento termina antes do próximo começar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  qualidade:
    name: Qualidade e build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist

  deploy:
    name: Deploy
    needs: qualidade
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
